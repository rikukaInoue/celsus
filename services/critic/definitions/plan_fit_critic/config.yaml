id: aria
version: 3
display_name: Aria（アリア）
extractors:
  code:
    - {type: ast_signature, weight: 0.3}
    - {type: type_info, weight: 0.3}
  prose:
    - {type: design_doc, weight: 1.0}
    - {type: plan_context, weight: 1.0}
    - {type: prior_decisions, weight: 0.8}
  shared:
    - {type: interface_boundary, weight: 0.4}
judgment_axes: [framing, patterns, underlying_causes]
speech_policy:
  alpha_weights: {relevance: 0.6, anomaly: 0.1, novelty: 0.3}
  threshold_low: 0.1
  threshold_high: 0.55
anchor_strength: 0.8
anisotropy_tolerance: low
