name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,app-config.yaml,app-config.production.yaml,examples/,catalog/"
          target: /home/ubuntu/celsus
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u rikukaInoue --password-stdin
            cd /home/ubuntu/celsus
            REGION=$(TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600") && curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
            get_param() { aws ssm get-parameter --region "$REGION" --name "$1" --with-decryption --query 'Parameter.Value' --output text; }
            DOMAIN=$(get_param /celsus/domain)
            cat > .env <<EOF
DOMAIN=${DOMAIN}
POSTGRES_PASSWORD=$(get_param /celsus/postgres-password)
AUTH_GOOGLE_CLIENT_ID=$(get_param /celsus/auth-google-client-id)
AUTH_GOOGLE_CLIENT_SECRET=$(get_param /celsus/auth-google-client-secret)
GITHUB_TOKEN=$(get_param /celsus/github-token)
BASE_URL=https://${DOMAIN}
BACKSTAGE_IMAGE=ghcr.io/rikukainoue/celsus:latest
EOF
            docker compose up -d --pull always
